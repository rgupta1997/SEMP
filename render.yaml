# Render Blueprint - SEMP backend (Express + Prisma, run with tsx).
#
# ---------------------------------------------------------------------------
# SUPERSEDED BY infra/ (AWS SAM: Lambda + API Gateway + RDS). Will not boot.
# ---------------------------------------------------------------------------
# This service sets NODE_ENV=production below, and env.schema.ts now refuses to boot
# in production unless REALTIME_TRANSPORT=appsync with a queue URL and a WebSocket
# endpoint - both of which are semp-api stack outputs. That guard is deliberate: the
# alternative is a bell that silently stops delivering live notifications and falls
# back to polling, which is a usable product and therefore something nobody reports.
#
# Render also has no instance role, so even with those values it would need static
# IAM credentials to reach SQS. Since the plan is to move off Render entirely, this
# file is kept for reference rather than updated.
#
# Usage: push this repo to GitHub, then in Render → New + → Blueprint → pick the repo.
# Set DATABASE_URL and WEB_ORIGIN in the dashboard (JWT_SECRET is generated for you).
services:
  - type: web
    name: semp-api
    runtime: node
    plan: free
    rootDir: .
    # --include=dev so tsx + prisma (devDependencies) are available for generate/runtime.
    #
    # This flag is LOAD-BEARING, and more so now that NODE_ENV=production is set below:
    # npm skips devDependencies in production by default, and startCommand is
    # `tsx src/main.ts` (there is no compile step - apps/api's `build` is
    # `tsc --noEmit`). Drop it and the service will not start at all.
    buildCommand: npm install --include=dev && npm run prisma:generate --workspace @semp/api
    startCommand: npm run start --workspace @semp/api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false            # Supabase TRANSACTION pooler: ...pooler.supabase.com:6543/postgres?pgbouncer=true&connection_limit=5
                               # Do NOT use the session pooler (:5432 on the pooler host) - its 15-slot pool exhausts under Prisma's pool.
      - key: JWT_SECRET
        generateValue: true    # Render generates a strong secret
      - key: WEB_ORIGIN
        sync: false            # your Netlify URL, e.g. https://your-app.netlify.app (comma-separate for multiple)
      # REQUIRED and has no default (apps/api/src/config/env.schema.ts). Everything
      # below it in this list exists BECAUSE of it: setting NODE_ENV=production
      # activates guards that refuse to boot without a real mail transport and with
      # the OTP bypasses on. Setting NODE_ENV alone would crash the service at boot,
      # so these land together or not at all.
      - key: NODE_ENV
        value: production
      # 'console' silently discards every email; env.ts refuses it in production.
      - key: MAIL_TRANSPORT
        value: http
      - key: MAIL_API_URL
        sync: false            # the mail service's BASE ORIGIN, no path
      - key: MAIL_API_KEY
        sync: false            # the SECRET only - sending `callerName:secret` is a 401
      - key: WEB_APP_URL
        sync: false            # ONE origin; every link in an outgoing email is built from it
      # Both hand sign-in codes back to the caller. /auth/otp/send is mounted before
      # requireAuth, so leaving either on in production is an unauthenticated sign-in
      # as any address in the system.
      - key: AUTH_EMAIL_BYPASS
        value: "false"
      - key: OTP_SMS_BYPASS
        value: "false"
      - key: NODE_VERSION
        value: "20"

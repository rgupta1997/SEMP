version = 0.1

# There is deliberately NO [default] section.
#
# samconfig.toml resolves relative to the CURRENT WORKING DIRECTORY, and one of the
# two stacks here owns the production database. A bare `sam deploy` should fail with
# "Missing option --stack-name" rather than guess which stack was meant, so every
# command names its target explicitly:
#
#   sam deploy --config-env infra --parameter-overrides AdminCidr=<your-ip>/32
#   sam build  --config-env api && sam deploy --config-env api
#
# Run both from the infra/ directory.

# ---------------------------------------------------------------------------
# semp-infra - RDS + secrets. Deployed rarely, always with a human in the loop.
# ---------------------------------------------------------------------------
# `sam validate` resolves its own config section, so template_file has to be
# repeated here - otherwise it looks for ./template.yml and reports "not found".
[infra.validate.parameters]
template_file = "semp-infra.yaml"
region        = "ap-south-1"
lint          = true

[infra.deploy.parameters]
template_file     = "semp-infra.yaml"
stack_name        = "semp-infra"
region            = "ap-south-1"
capabilities      = "CAPABILITY_IAM"
resolve_s3        = true
# This stack holds the data. Read every changeset, and treat any line saying
# "Replacement: True" on DbInstance as a stop-and-think.
confirm_changeset = true
tags              = "app=semp stack=infra managed-by=sam"
# VpcId and SubnetIds are pinned here so the deploy is reproducible. They are not
# secret. AdminCidr is NOT here on purpose - it is somebody's home IP address.
#
# CAVEAT: a CLI --parameter-overrides REPLACES this whole list rather than merging
# into it, so any deploy that overrides AdminCidr must re-pass VpcId and SubnetIds
# too, or CloudFormation rejects the changeset with "must have values". The commands
# in README.md and RUNBOOK-rds.md pass all three.
#
# SubnetIds must be >=2 subnets in DIFFERENT availability zones or the DBSubnetGroup
# is rejected. To re-derive these, or to target another account, work through step 1
# of RUNBOOK-rds.md - it checks six things, and picking subnets by name alone misses
# four of them.
#
# Verified 2026-09-04 against account 506491559903, region ap-south-1:
#   - default VPC, stock 172.31.0.0/16
#   - enableDnsSupport = enableDnsHostnames = True (required by PubliclyAccessible)
#   - both subnets resolve through the VPC main route table rtb-019b468b8c535f5f1,
#     which has 0.0.0.0/0 -> igw-012579f52069f2b1a, so both are genuinely public
#   - db.t4g.small / postgres 17.7 orderable in 1a, 1b and 1c
#   - no semp-prod instance and no semp/ secrets existed beforehand
parameter_overrides = [
  "VpcId=vpc-0295723a4b343412c",
  "SubnetIds=subnet-0ac9c6a2778f3c7ce,subnet-0fc4c1b851b823704",
]

# ---------------------------------------------------------------------------
# semp-api - Lambda + HTTP API. Deployed on every push.
# ---------------------------------------------------------------------------
[api.validate.parameters]
template_file = "semp-api.yaml"
region        = "ap-south-1"
lint          = true

[api.build.parameters]
template_file = "semp-api.yaml"
# REQUIRED, not an optimisation.
#
# By default `sam build` runs CustomMakeBuilder:CopySource first - it copies CodeUri
# to a scratch directory under .aws-sam/ and runs the Makefile THERE. That breaks
# this build in two ways at once: the bundle resolves packages/*/src/*.ts by
# relative path (those workspace packages have no compiled output - their
# package.json "main" points at a .ts file), and @prisma/client is hoisted to the
# monorepo root. Neither exists in a copy of apps/api alone.
#
# build_in_source runs the Makefile in the real apps/api instead, so both resolve.
# Verified: without it the build fails on `../../node_modules/.bin/prisma: No such
# file or directory`.
build_in_source = true
# NO use_container - a container mounts even less than the scratch copy does.
cached          = false

[api.deploy.parameters]
# template_file deliberately points at the BUILT template, not semp-api.yaml.
#
# `sam deploy` defaults to .aws-sam/build/template.yaml when a build exists, and that
# is the template whose CodeUri points at each function's own artifact directory.
# Naming the source template here overrides that default: SAM then packages
# `CodeUri: ../apps/api` verbatim, so all three functions receive the same ~24 MB zip
# of the source tree with no index.mjs at its root, and every one of them fails at
# init with `Runtime.ImportModuleError: Cannot find module 'index'`.
#
# It looks harmless because `sam build` still succeeds and the artifacts under
# .aws-sam/build are correct - they are simply never used. Verified on the first real
# deploy of semp-uat, where all three functions came back with an identical
# CodeSha256.
template_file     = ".aws-sam/build/template.yaml"
stack_name        = "semp-api"
region            = "ap-south-1"
capabilities      = "CAPABILITY_IAM"
resolve_s3        = true
# Runs on every push, so no prompt. Safe because this stack cannot reach the
# database's resources - it imports two secret ARNs and nothing else.
confirm_changeset = false
tags              = "app=semp stack=api managed-by=sam"
# SecretsExtensionLayerArn is deliberately ABSENT. It used to be a REPLACE_ME on the
# reasoning that the ARN is per-region, per-architecture and version-bumped, so no
# default could be safe. That was wrong in one specific way: AWS publishes the current
# ARN as a PUBLIC SSM parameter per architecture, correct in every region, and
# semp-api.yaml now resolves it at deploy time. Hardcoding was in fact the unsafe
# option - the AWS docs table lists ap-south-1 arm64 at version 111 while the account
# serves 137, so anyone pasting from the docs would pin a stale layer.
#
# Pass it explicitly only to reproduce a past build byte-for-byte.
#
# WebOrigin/WebAppUrl/MailApiUrl: fill in the real origins. WebOrigin is a
# comma-separated CORS list; WebAppUrl is ONE origin with no trailing slash.
parameter_overrides = [
  "InfraStackName=semp-infra",
  "WebOrigin=https://REPLACE_ME",
  "WebAppUrl=https://REPLACE_ME",
  "MailApiUrl=https://REPLACE_ME",
  # 0 means omit. Raise to 10 only after the account's Lambda concurrency quota is
  # above 20 - see the ReservedConcurrency parameter description.
  "ReservedConcurrency=0",
]

# ---------------------------------------------------------------------------
# semp-uat - the UAT stack. Deploys ALONGSIDE everything already running.
# ---------------------------------------------------------------------------
# Why a separate config env rather than editing [api] above: two other deployments
# already exist in this account and neither may be disturbed.
#
#   PRODUCTION  serves https://events.sportagon.in, whose frontend calls
#               https://www.events-api.sportagon.in. Not this stack, not the Lambda
#               below, and nothing here touches it.
#   BETA        the UNMANAGED `semp-api` Lambda + `semp-api-gateway` HTTP API created
#               by scripts/deploy-lambda.sh. Still live (~21.8k invocations / 14 days
#               when checked on 2026-09-22) and still on Supabase - its DATABASE_URL
#               points at the pooler for project iwxgd..., and its WEB_ORIGIN is the
#               sportagon-eos.netlify.app previews, which is how you can tell it is
#               not production: events.sportagon.in is not in its CORS list, so the
#               production frontend could not call it even if DNS pointed there.
#
# README.md blocker 8 describes those beta resources as abandoned leftovers to tear
# down before this stack can deploy. That was true when it was written and is NOT
# true now - they carry traffic. FunctionName below is what avoids the collision
# instead: every name this stack claims is derived from it, so nothing overlaps.
#
# FunctionName=semp-uat therefore yields semp-uat, semp-uat-events,
# semp-uat-realtime{,-dlq}, semp-uat-realtime-{authorizer,publisher} and the matching
# log groups. All verified free in ap-south-1 before first deploy.
[uat.validate.parameters]
template_file = "semp-api.yaml"
region        = "ap-south-1"
lint          = true

[uat.build.parameters]
template_file   = "semp-api.yaml"
# Same requirement as [api.build] - see the long note there and apps/api/Makefile.
build_in_source = true
cached          = false

[uat.deploy.parameters]
# template_file deliberately points at the BUILT template, not semp-api.yaml.
#
# `sam deploy` defaults to .aws-sam/build/template.yaml when a build exists, and that
# is the template whose CodeUri points at each function's own artifact directory.
# Naming the source template here overrides that default: SAM then packages
# `CodeUri: ../apps/api` verbatim, so all three functions receive the same ~24 MB zip
# of the source tree with no index.mjs at its root, and every one of them fails at
# init with `Runtime.ImportModuleError: Cannot find module 'index'`.
#
# It looks harmless because `sam build` still succeeds and the artifacts under
# .aws-sam/build are correct - they are simply never used. Verified on the first real
# deploy of semp-uat, where all three functions came back with an identical
# CodeSha256.
template_file     = ".aws-sam/build/template.yaml"
stack_name        = "semp-uat"
region            = "ap-south-1"
capabilities      = "CAPABILITY_IAM"
resolve_s3        = true
# TRUE, unlike [api]. This stack shares semp-infra's database - which holds real
# production data migrated off Supabase - so every changeset gets read by a human.
confirm_changeset = true
tags              = "app=semp stack=uat managed-by=sam"
parameter_overrides = [
  "FunctionName=semp-uat",
  "InfraStackName=semp-infra",
  # Points at the SAME RDS as any future production stack, because that is where the
  # migrated data lives. Additive writes only: no stack runs migrations (see
  # README.md blocker 1), and exercising notifications inserts rows rather than
  # changing schema. A snapshot exists as the restore point.
  "WebOrigin=https://events.sportagon.in,https://semp-uat.netlify.app",
  "WebAppUrl=https://events.sportagon.in",
  # DELIBERATELY NOT the real mail service.
  #
  # `.invalid` is reserved by RFC 2606 and is guaranteed never to resolve, so this
  # cannot accidentally reach anyone's server. The reason is that UAT points at the
  # database holding migrated PRODUCTION data: every notification resolves real
  # recipients from real rows, and a snapshot can undo a write but cannot unsend an
  # email.
  #
  # Nothing breaks. sendMailBatch's DNS failure is caught by emailRecipients in
  # notify.ts, which logs and continues - the feed row is already written and is the
  # primary channel. The AppSync realtime path, which is what UAT exists to exercise,
  # is unaffected.
  #
  # What DOES stop working is OTP sign-in: signin.routes.ts discards the token when
  # delivery fails, so the code never arrives. Use POST /auth/login instead - it is
  # email + bcrypt with no mail involved. MAIL_API_KEY in AppSecret still has to be
  # non-empty for the schema to boot, but its value is irrelevant while this URL
  # never resolves.
  #
  # To send real mail from UAT, swap this for the real origin:
  #   https://fjj2qymohk2fy6cpyzfihn6ud40lkhwg.lambda-url.ap-south-1.on.aws
  "MailApiUrl=https://mail.invalid",
  "ReservedConcurrency=0",
]
